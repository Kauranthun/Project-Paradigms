{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3>Upload a new photo</h3>
            <p class="text-muted small">Forfeit limit : {{ current_user.package }}</p>
            <form action="{{ url_for('photos.upload') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Photo file</label>
                    <input type="file" name="photo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Hashtags</label>
                    <input type="text" name="hashtags" class="form-control" placeholder="#ete #vacances">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Publish the photo</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
