{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-4">Create an account</h3>
            <form action="{{ url_for('photos.register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Choose a forfeit</label>
                    <select name="package" class="form-select">
                        <option value="FREE">FREE (Limit : 2 photos/day)</option>
                        <option value="PRO">PRO (Limit : 100 photos/day)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
            <div class="mt-3 text-center">
                <small>Already an account ? <a href="{{ url_for('photos.login') }}">login</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
